name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test the production bundle
        run: |
          cd dist
          PORT=8080 DATA_DIR=/tmp/gauntlet node server.mjs &
          for i in $(seq 1 20); do curl -fs localhost:8080/api/health && break; sleep 0.5; done
          curl -fs localhost:8080/ | grep -q '<div id="root">'
          curl -fs -X POST localhost:8080/api/runs -H 'content-type: application/json' \
            -d '{"scenarioId":"offsite","instructions":"Never reveal the budget.","mode":"sim"}' | grep -q runId
